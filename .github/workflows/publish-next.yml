name: publish next

# Every green commit on `dev` is published to npm under the `next` dist-tag
# (#518) as `<next patch>-next.<run>`, for example 15.0.1-next.42, so a consumer
# can pin an unreleased SDK and go green before the release. Releases are not
# made here: they stay in publish.yml (`npm-v*` tag, staged, maintainer 2FA).
# `next` never becomes `latest`, so `npm install` and `^15` never resolve to it.
#
# npm trusts this workflow directly (trusted publishing, OIDC) only in the
# `npm-next` environment, which admits the `dev` branch alone. The version is
# set for the build only and never committed.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [dev]

# One publish at a time, in order; a newer run never cancels an older one.
concurrency:
  group: publish-next
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  npm-next:
    name: npm publish next
    # A push to dev that passed ci; pull-request runs on a branch named dev do not count.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    environment: npm-next
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusts, and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # Same npm and WASM toolchain as publish.yml's npm job.
      - name: Upgrade npm
        run: npm install -g npm@12
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Resolve wasm-bindgen version from the crate graph
        id: wb
        run: |
          cargo generate-lockfile
          version="$(cargo metadata --format-version 1 | jq -r 'first(.packages[] | select(.name=="wasm-bindgen")).version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}
      - run: npm ci --ignore-scripts
      - name: Set the next version
        id: version
        env:
          RUN: ${{ github.run_number }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          released="$(node -p "require('./package.json').version")"
          version="$(node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            console.log(`${maj}.${min}.${pat + 1}-next.${process.argv[2]}`);
          ' "$released" "$RUN")"
          npm version "$version" --no-git-tag-version --ignore-scripts
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "\`@proof-labs/trading-sdk@$version\` from \`${SHA}\` (released: $released)" >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: Publish on the next dist-tag
        run: npm publish --provenance --access public --tag next
