name: Decision rows

# Public-repository form of the decision-rows check, synced by
# Proof-labs/.github → scripts/sync-agent-config.sh. A public repository cannot
# call the reusable workflow in the private Proof-labs/.github, so its steps are
# inlined here. Change validate-decision-rows.yml there, then copy the steps;
# scripts/test-sync-agent-config.py fails while they differ.

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: decision-rows / validate
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ secrets.PROOF_ASSISTANT_APP_ID != '' && secrets.PROOF_ASSISTANT_PRIVATE_KEY != '' }}
    steps:
      - name: Mint a short-lived token scoped to the vault
        id: vault
        if: env.HAVE_APP == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROOF_ASSISTANT_APP_ID }}
          private-key: ${{ secrets.PROOF_ASSISTANT_PRIVATE_KEY }}
          owner: Proof-labs
          repositories: ProofOfBrain
          permission-contents: read

      - name: Fetch the decision register (sparse, read-only)
        if: env.HAVE_APP == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Proof-labs/ProofOfBrain
          ref: dev
          token: ${{ steps.vault.outputs.token }}
          path: .decision-register
          sparse-checkout: delivery/decision-register.md
          sparse-checkout-cone-mode: false
          fetch-depth: 1
          persist-credentials: false

      - name: Verify cited DEC-N rows are Decided
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys, pathlib

          body  = os.environ.get("PR_BODY") or ""
          draft = os.environ.get("PR_DRAFT", "false") == "true"
          have_key = os.environ.get("HAVE_APP") == "true"
          REG = pathlib.Path(".decision-register/delivery/decision-register.md")

          def _is_decided(cell):
              """True when a register Status cell says Decided.

              The register writes the status in bold — `**Decided 2026-07-24** — ...` —
              so a bare startswith("Decided") is False for every genuinely decided row.
              Strip markdown emphasis first, then compare case-insensitively.
              Statuses are Open / Blocked / Decided, so a prefix match is unambiguous
              once the emphasis is gone.
              """
              return re.sub(r"^[\s*_`~]+", "", cell or "").lower().startswith("decided")

          def notice(m): print(f"::notice title=Decision rows::{m}")
          def fail(m):
              print(f"::error title=Decision rows::{m}")
              sys.exit(1)

          if draft:
              notice("Draft — skipped. The check runs when this is marked ready for review.")
              sys.exit(0)

          rows = sorted({int(n) for n in re.findall(r"DEC-(\d+)", body)})

          if not rows:
              hold = re.search(
                  r"decision hold|requires? (an )?explicit|needs? (a )?decision"
                  r"|requires? (product|risk|business|team) (approval|decision)"
                  r"|separate approval|awaiting (a )?decision|requires sign-?off",
                  body, re.I)
              notice("This body reads like it is waiting on a decision, but cites no DEC-N row. "
                     "If that is right, add a register row (.github/new-decision-row.py) and mark "
                     "this draft — otherwise ignore this note. Advisory only."
                     if hold else "No DEC-N rows cited — nothing to verify.")
              sys.exit(0)

          cited = ", ".join(f"DEC-{n}" for n in rows)

          if not have_key or not REG.is_file():
              fail(f"This ready pull request cites {cited}, but the register could not be read: "
                   f"the app credentials (PROOF_ASSISTANT_APP_ID / _PRIVATE_KEY) are missing or "
                   f"invalid, or the sparse checkout failed. Failing closed — add or repair the org "
                   f"secrets (GitHub App with contents:read on "
                   f"Proof-labs/ProofOfBrain, see docs/SECURITY.md §8.1), or mark this draft while "
                   f"the rows are Open.")

          content = REG.read_text(encoding="utf-8")
          undecided, missing = [], []
          for n in rows:
              m = re.search(rf"^\|\s*DEC-{n}\s*\|.*$", content, re.M)
              if not m:
                  missing.append(f"DEC-{n}")
                  continue
              cells = [c.strip() for c in m.group(0).split("|")]
              status = cells[-2] if len(cells) >= 2 else ""
              if not _is_decided(status):
                  undecided.append(f"DEC-{n}")

          if missing:
              fail(f"Cited but not in the register: {', '.join(missing)}. Create the row first "
                   f"(.github/new-decision-row.py) — a cited row that does not exist cannot be "
                   f"decided, so this pull request can never legitimately become ready.")
          if undecided:
              fail(f"Not Decided yet: {', '.join(undecided)}. A pull request whose merge needs a "
                   f"decision stays DRAFT until every cited row is Decided. Mark this draft, and "
                   f"it will be picked up at the weekly decision moment.")

          notice(f"All cited rows are Decided: {cited}.")
          PY
