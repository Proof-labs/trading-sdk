name: publish

# Release path for the SDK's published artifacts (resolves #80). Each package
# is published INDEPENDENTLY by pushing its own tag — the repository keeps every
# package on its own semver line (see CLAUDE.md "Versioning"), so there is no
# single umbrella version. Push the tag for the artifact you are cutting:
#
#   npm-v3.0.0      -> npm  @prooftrade/trading-sdk        + the GitHub Release
#   v3.0.0          -> crates.io proof-trading-sdk
#   derive-v1.1.0   -> crates.io proof-trading-sdk-derive
#   wasm-v2.1.0     -> crates.io proof-trading-sdk-wasm
#   py-v3.0.0       -> PyPI proof-trading-sdk (the maturin wheel + sdist)
#
# The PyO3 binding is not published to crates.io — it ships only inside the
# PyPI wheel (py-v*), so it has no tag of its own.
#
# crates.io dependency order (publish must respect it): derive -> core -> wasm.
# Push the tags in that order; crates.io needs a dependency published before
# the crates that depend on it.
#
# Every job fails closed if the pushed tag's version does not match the version
# in the package manifest, so a mistagged release cannot publish wrong bytes.
#
# A publish is refused unless the tagged commit has a SUCCESSFUL run of ci.yml
# (the `verify-ci` job below). Tagging is a manual act on an irreversible
# publish — crates.io cannot be un-published and npm unpublish is limited to
# 72 hours — so the tag alone is not accepted as proof the code works.
#
# Required repository secrets (none of these exist yet — see #80):
#   NPM_TOKEN             npm automation token, publish scope
#   CARGO_REGISTRY_TOKEN  crates.io API token
#   MATURIN_PYPI_TOKEN    PyPI API token
#
# ponytail: single workflow, per-tag jobs. Add a signing/attestation step or a
# multi-OS wheel matrix only when a consumer actually needs it.

on:
  push:
    tags:
      - "npm-v*"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "derive-v*"
      - "wasm-v*"
      - "py-v*"

# Serialize re-pushes of the SAME tag. Note this does NOT order two different
# tags against each other: `derive-v*`, `v*` and `wasm-v*` land in separate
# groups and run concurrently, so pushing them together races the crates.io
# dependency order above. Push one crate tag at a time and wait for it to go
# green before the next. (A single global group would order them, but GitHub
# keeps only one run pending per group and cancels the older pending one, which
# would silently drop a release — worse than a loud failure.)
concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fail closed: refuse to publish a commit that never went green. ci.yml runs on
  # pushes to dev and main and on pull requests, but NOT on tags, so there is no
  # run attached to the tag ref itself — this looks up runs for the tagged
  # COMMIT. A tag placed on an untested commit stops here, before any registry
  # is touched.
  verify-ci:
    name: verify the tagged commit passed ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read this repository's workflow runs
    steps:
      - name: Require a successful ci.yml run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" \
            --jq '.total_count')"
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::no successful ci.yml run for $GITHUB_SHA ($GITHUB_REF_NAME) — refusing to publish"
            echo "Tag a commit that has gone green on dev or main, or re-run ci for this commit."
            exit 1
          fi
          echo "ci.yml is green for $GITHUB_SHA — proceeding."

  npm:
    name: npm publish
    needs: verify-ci
    if: startsWith(github.ref_name, 'npm-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # cut the GitHub Release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      # The build compiles the WASM core with a wasm-bindgen CLI whose version is
      # resolved from the crate graph, the same rule ci.yml uses. That guarantees
      # CLI-to-crate consistency (a mismatch hard-errors on the bindings' schema
      # check) — it does NOT guarantee the published .wasm is byte-identical to
      # what CI built: `Cargo.lock` is gitignored, so `cargo generate-lockfile`
      # below re-resolves the graph at publish time and a dependency released
      # since the CI run can change it. See #80's WASM reproducibility point;
      # closing it fully needs a committed lockfile built with `--locked`, or
      # publishing the exact artifact CI produced.
      # Fetch the private `exchange-wire` git dependency: `npm run build`
      # compiles the Rust core to WASM, and since the shared-crate cutover
      # that core pins exchange-wire from the private engine repository. Same
      # binding ci.yml uses for the TypeScript job.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EXCHANGE_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Resolve wasm-bindgen version from the crate graph
        id: wb
        run: |
          cargo generate-lockfile
          version="$(cargo metadata --format-version 1 | jq -r 'first(.packages[] | select(.name=="wasm-bindgen")).version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.wb.outputs.version }}
      - run: npm ci --ignore-scripts
      - name: Verify the tag matches package.json
        run: |
          tag_version="${GITHUB_REF_NAME#npm-v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies $tag_version but package.json is $pkg_version"
            exit 1
          fi
      - run: npm run build
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Cut the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md for this release."

  crate:
    name: crates.io publish
    needs: verify-ci
    # One job for every crate tag; the crate is derived from the tag prefix.
    if: >-
      startsWith(github.ref_name, 'v') ||
      startsWith(github.ref_name, 'derive-v') ||
      startsWith(github.ref_name, 'wasm-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace currently pins exchange-wire to the private exchange
      # repository. Cargo resolves that dependency while packaging the crate.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EXCHANGE_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # --no-verify for the crates whose verify build cannot run on the host:
      # the wasm crate is a wasm32 cdylib and the core is pulled in
      # transitively. derive is a proc-macro and verifies natively. The whole
      # step is one shell block so the optional flag rides a bash array
      # ("${verify[@]}") — an empty array vanishes, no word-splitting quibble.
      - name: Validate release tag and package version
        run: |
          if ! printf '%s' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$|^(derive|wasm)-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::invalid release tag $GITHUB_REF_NAME"
            exit 1
          fi
          case "$GITHUB_REF_NAME" in
            v*)        dir=proof-trading-sdk ;;
            derive-v*) dir=proof-trading-sdk-derive ;;
            wasm-v*)   dir=proof-trading-sdk-wasm ;;
            *) echo "::error::unhandled crate tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
          tag_version="${GITHUB_REF_NAME##*v}"
          crate_version="$(grep -m1 '^version = ' "crates/$dir/Cargo.toml" | cut -d'"' -f2)"
          if [ "$tag_version" != "$crate_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies $tag_version but crate is $crate_version"
            exit 1
          fi

      - name: Dry-run crates.io publish
        run: |
          case "$GITHUB_REF_NAME" in
            v*)        crate=proof-trading-sdk;        verify=(--no-verify) ;;
            derive-v*) crate=proof-trading-sdk-derive; verify=() ;;
            wasm-v*)   crate=proof-trading-sdk-wasm;   verify=(--no-verify) ;;
          esac
          cargo publish -p "$crate" --dry-run "${verify[@]}"

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          case "$GITHUB_REF_NAME" in
            v*)        crate=proof-trading-sdk;        verify=(--no-verify) ;;
            derive-v*) crate=proof-trading-sdk-derive; verify=() ;;
            wasm-v*)   crate=proof-trading-sdk-wasm;   verify=(--no-verify) ;;
            *) echo "::error::unhandled crate tag $GITHUB_REF_NAME"; exit 1 ;;
          esac
          cargo publish -p "$crate" "${verify[@]}"

  python:
    name: PyPI publish
    needs: verify-ci
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Fetch the private `exchange-wire` git dependency: maturin builds the PyO3
      # core, and since the shared-crate cutover
      # that core pins exchange-wire from the private engine repository. Same
      # binding ci.yml uses for the Python job.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EXCHANGE_DEPLOY_KEY }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the tag matches pyproject.toml
        run: |
          tag_version="${GITHUB_REF_NAME#py-v}"
          py_version="$(grep -m1 '^version = ' python/pyproject.toml | cut -d'"' -f2)"
          if [ "$tag_version" != "$py_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies $tag_version but pyproject is $py_version"
            exit 1
          fi
      # abi3 wheel (one wheel spans the 3.11+ ABI) + sdist. Linux only for now.
      # The cp311 floor comes from the `abi3-py311` feature in pyproject.toml /
      # the pyo3 crate, not from the `python-version` above, so the tag stays
      # `cp311-abi3` whichever interpreter builds it.
      # ponytail: single-platform wheels. Add a macOS/Windows matrix via
      # maturin-action's target inputs when a consumer needs a native wheel
      # there; the sdist already lets them build from source meanwhile.
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: publish
          args: --sdist --non-interactive
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.MATURIN_PYPI_TOKEN }}
