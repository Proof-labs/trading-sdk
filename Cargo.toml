[workspace]
members = [
    "crates/proof-trading-sdk",
    "crates/proof-sdk-rs",
    "crates/proof-trading-sdk-derive",
    "crates/proof-trading-sdk-pyo3",
    "crates/proof-trading-sdk-wasm",
    "crates/spec",
]
resolver = "2"

# Local only: build against the exchange min-order-lots branch until its wire
# is released; replace with a pin bump to the new proof-wire tag.
[patch."https://github.com/Proof-labs/wire.git"]
proof-wire = { path = "../exchange-min-order-notional/exchange-wire" }
