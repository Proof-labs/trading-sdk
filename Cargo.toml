# crates/proof-trading-sdk/Cargo.toml.
[patch."https://github.com/Proof-labs/wire.git"]
proof-wire = { git = "https://github.com/Proof-labs/exchange", rev = "2f188e28922759e8d5781ff0703906c91611de37" }
