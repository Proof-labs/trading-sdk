[package]
name = "proof-trading-sdk"
version = "3.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust core for the Proof trading SDK: MessagePack codec, Ed25519 signing, and wire types. Hub of the wheel-and-spokes SDK."
repository = "https://github.com/Proof-labs/trading-sdk"

[features]
gateway = ["dep:reqwest", "dep:tokio", "dep:chrono"]

[dependencies]
serde = { version = "1", features = ["derive"] }
derive_more = { version = "1", features = ["from", "display"] }
serde_bytes = "0.11"
rmp-serde = "1"
# The wire contract is the shared `proof-wire` crate (engine + SDK share
# one definition), extracted to the public Proof-labs/wire repository on
# 2026-09-09 and pinned to its release tag. Replaces the rev-pinned private
# fetch from Proof-labs/exchange (last pinned 6a640c45 — wire 1.4.0 with
# exchange#471's CancelAllOrdersForAccount, per #111's bump); proof-wire
# v1.5.0 carries that content plus EN-01's CreateEvent at inner tag 0x09.
# The extraction also removed the deploy-key fetch this dependency used to
# require.
proof-wire = { git = "https://github.com/Proof-labs/wire.git", tag = "v1.5.0" }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
sha3 = "0.12"
# SHA-256 for the admin-proposal content hash (§2.4) — must match exchange-core.
sha2 = "0.11"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }

# Inherited from exchange-core: the wire layer holds these guarantees regardless
# of where it is compiled. Enforced under `cargo clippy`.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"
arithmetic_side_effects = "deny"
disallowed_types = "deny"
