[package]
name = "proof-trading-sdk"
version = "3.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust core for the Proof trading SDK: MessagePack codec, Ed25519 signing, and wire types. Hub of the wheel-and-spokes SDK."
repository = "https://github.com/Proof-labs/trading-sdk"

[features]
gateway = ["dep:reqwest", "dep:tokio", "dep:chrono"]

[dependencies]
serde = { version = "1", features = ["derive"] }
derive_more = { version = "1", features = ["from", "display"] }
serde_bytes = "0.11"
rmp-serde = "1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
base64 = "0.22"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }
# The wire contract is the shared `exchange-wire` crate (engine + SDK share
# one definition). Pinned to the merged `dev` rev (exchange#471 — exchange-wire
# 1.4.0, adds `AdminAction::CancelAllOrdersForAccount` at inner tag 0x08 on
# top of 1.3.0's `UpdateAuthoritySet` at 0x07); swaps to a published crates.io
# version once exchange-wire is published.
exchange-wire = { git = "ssh://git@github.com/Proof-labs/exchange.git", rev = "f60b3ece02ed1a077cd8e6adaeae0b8aa703819c", version = "1" }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
sha3 = "0.12"
# SHA-256 for the admin-proposal content hash (§2.4) — must match exchange-core.
sha2 = "0.11"

[dev-dependencies]
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }

# Inherited from exchange-core: the wire layer holds these guarantees regardless
# of where it is compiled. Enforced under `cargo clippy`.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"
arithmetic_side_effects = "deny"
disallowed_types = "deny"
