[package]
name = "proof-trading-sdk"
version = "4.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust core for the Proof trading SDK: MessagePack codec, Ed25519 signing, and wire types. Hub of the wheel-and-spokes SDK."
repository = "https://github.com/Proof-labs/trading-sdk"

[features]
default = []
# Native, gateway-only operator transport; codec/WASM consumers stay network-free.
gateway = ["dep:reqwest", "dep:tokio", "dep:httpdate", "dep:chrono"]

[[example]]
name = "gateway_oracle_probe"
required-features = ["gateway"]

[dependencies]
serde = { version = "1", features = ["derive"] }
derive_more = { version = "1", features = ["from", "display"] }
serde_bytes = "0.11"
rmp-serde = "1"
rmpv = { version = "1.3.1", features = ["with-serde"] }
# The wire contract is the shared `proof-wire` crate (engine + SDK share
# one definition), extracted to the public Proof-labs/wire repository on
# 2026-09-09 and pinned to its release tag. Replaces the rev-pinned private
# fetch from Proof-labs/exchange. v1.7.0 carries the F16 oracle-policy
# surface: SubmitOracleObservation (0x2D), ConfigureOraclePolicy (inner
# 0x0C), SetOracleGuards (inner 0x0D), MarketOracleGuards,
# OracleRejectReason, FundingSkipReason, and ExecError code 82.
proof-wire = { git = "https://github.com/Proof-labs/wire.git", tag = "v2.1.0" }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
sha3 = "0.12"
# SHA-256 for the admin-proposal content hash (§2.4) — must match exchange-core.
sha2 = "0.11"
base64 = "0.22"
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"], optional = true }
tokio = { version = "1", features = ["time"], optional = true }
httpdate = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }

# Inherited from exchange-core: the wire layer holds these guarantees regardless
# of where it is compiled. Enforced under `cargo clippy`.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"
arithmetic_side_effects = "deny"
disallowed_types = "deny"
