[package]
name = "proof-trading-sdk"
version = "3.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust core for the Proof trading SDK: MessagePack codec, Ed25519 signing, and wire types. Hub of the wheel-and-spokes SDK."
repository = "https://github.com/Proof-labs/trading-sdk"

[dependencies]
serde = { version = "1", features = ["derive"] }
derive_more = { version = "1", features = ["from", "display"] }
serde_bytes = "0.11"
rmp-serde = "1"
# The wire contract is the shared `exchange-wire` crate (engine + SDK share
# one definition). In-progress exact F16 revision; publish the exchange feature
# branch before SDK CI can resolve this commit. Replace with the independently
# approved merged revision before release; no local paths are shipped.
exchange-wire = { git = "ssh://git@github.com/Proof-labs/exchange.git", rev = "b4b9993b6a2aa2eb93087c645818c88cf4fac7b6", version = "1.5" }
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
sha3 = "0.12"
# SHA-256 for the admin-proposal content hash (§2.4) — must match exchange-core.
sha2 = "0.11"

[dev-dependencies]
hex = "0.4"
serde_json = "1"

# Inherited from exchange-core: the wire layer holds these guarantees regardless
# of where it is compiled. Enforced under `cargo clippy`.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_arithmetic = "deny"
arithmetic_side_effects = "deny"
disallowed_types = "deny"
